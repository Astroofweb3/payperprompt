<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayPerPrompt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:monospace;padding:20px}h1{color:#00ff88;font-size:24px;margin-bottom:5px}.sub{color:#888;font-size:13px;margin-bottom:30px}.input-area{display:flex;gap:10px;margin-bottom:20px}input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;font-family:monospace;font-size:14px}button{background:#00ff88;color:#000;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer}.stats{display:flex;gap:10px;margin-bottom:20px}.stat{background:#111;border:1px solid #222;padding:15px;border-radius:8px;flex:1}.stat-label{color:#888;font-size:11px;margin-bottom:5px}.stat-value{color:#00ff88;font-size:18px;font-weight:bold}.payments{background:#111;border:1px solid #222;border-radius:8px}.payments-header{padding:12px 15px;border-bottom:1px solid #222;color:#888;font-size:12px}.payment-item{padding:12px 15px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between}.payment-prompt{color:#fff;font-size:13px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.payment-cost{color:#00ff88;font-size:13px}.payment-time{color:#555;font-size:11px}.badge{background:#003322;color:#00ff88;font-size:10px;padding:2px 8px;border-radius:20px}.response-box{background:#111;border:1px solid #333;border-radius:8px;padding:15px;margin-bottom:20px;color:#ccc;font-size:13px;min-height:50px}
</style>
</head>
<body>
<h1>PayPerPrompt</h1>
<p class="sub">AI agent powered by Circle Nanopayments on Arc testnet</p>
<div class="input-area">
<input type="text" id="promptInput" placeholder="Enter your prompt..." />
<button onclick="sendPrompt()">Send</button>
</div>
<div id="responseBox" class="response-box">Response will appear here...</div>
<div class="stats">
<div class="stat"><div class="stat-label">TOTAL PAYMENTS</div><div class="stat-value" id="totalPayments">0</div></div>
<div class="stat"><div class="stat-label">USDC SPENT</div><div class="stat-value" id="totalSpent">$0.000000</div></div>
<div class="stat"><div class="stat-label">NETWORK</div><div class="stat-value" style="font-size:12px">Arc Testnet</div></div>
</div>
<div class="payments">
<div class="payments-header">LIVE PAYMENT STREAM</div>
<div id="paymentList"></div>
</div>
<script>
async function sendPrompt(){const input=document.getElementById('promptInput');const prompt=input.value.trim();if(!prompt)return;document.getElementById('responseBox').textContent='Processing payment...';input.value='';const res=await fetch('/api/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const data=await res.json();document.getElementById('responseBox').textContent=data.response;loadPayments()}
async function loadPayments(){const res=await fetch('/api/payments');const payments=await res.json();document.getElementById('totalPayments').textContent=payments.length;const total=payments.reduce((sum,p)=>sum+parseFloat(p.cost),0);document.getElementById('totalSpent').textContent='$'+total.toFixed(6);const list=document.getElementById('paymentList');list.innerHTML=payments.reverse().map(p=>`<div class="payment-item"><div><div class="payment-prompt">${p.prompt}</div><div class="payment-time">${new Date(p.timestamp).toLocaleTimeString()}</div></div><div style="text-align:right"><div class="payment-cost">$${p.cost} USDC</div><span class="badge">settled</span></div></div>`).join('')}
document.getElementById('promptInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendPrompt()});
setInterval(loadPayments,3000);
</script>
</body>
</html>
